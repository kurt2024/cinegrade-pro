name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo'yu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Java (JDK 17) Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cordova Kur
      run: npm install -g cordova

    - name: Temiz Kurulum ve Android Platformunu Ekle
      run: |
        rm -rf platforms
        rm -rf plugins
        cordova platform add android@13.0.0

    - name: APK Derle (Debug & Release)
      run: |
        cordova build android

    - name: APK Dosyalarını Listele (Debug amaçlı log)
      run: |
        find platforms/android -name "*.apk"

    - name: APK Dosyasını Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: CineGrade-Pro-APK
        path: |
          platforms/android/app/build/outputs/apk/**/*.apk
          platforms/android/app/build/outputs/apk/debug/*.apk
          platforms/android/app/build/outputs/apk/release/*.apk
